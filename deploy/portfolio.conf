# Apache vhost for the portfolio.
#
# Install on the VPS:
#   sudo cp portfolio.conf /etc/apache2/sites-available/portfolio.conf
#   sudo a2enmod headers expires ssl rewrite
#   sudo a2ensite portfolio
#   sudo a2dissite 000-default   # only once this vhost answers for your domain
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#
# Replace example.com and the certificate paths before enabling.
# This vhost only owns its own hostname and /var/www/portfolio; it does not
# touch the Nextcloud vhost or its document root.

<VirtualHost *:80>
    ServerName example.com
    ServerAlias www.example.com

    RewriteEngine On
    RewriteRule ^ https://example.com%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName example.com
    ServerAlias www.example.com

    DocumentRoot /var/www/portfolio

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/example.com/privkey.pem

    # Send www to the bare domain.
    RewriteEngine On
    RewriteCond %{HTTP_HOST} ^www\. [NC]
    RewriteRule ^ https://example.com%{REQUEST_URI} [R=301,L]

    <Directory /var/www/portfolio>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    ErrorDocument 404 /404.html

    # WebAssembly (emulators, games). Debian's mime.types usually has this already.
    AddType application/wasm .wasm

    # Caching: Astro's bundled assets have a content hash in their name, so they
    # can be cached forever. HTML must be revalidated so deploys show up at once.
    <LocationMatch "^/_astro/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>
    <FilesMatch "\.html$">
        Header set Cache-Control "no-cache"
    </FilesMatch>

    # Security headers.
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Strict-Transport-Security "max-age=31536000"

    # Needed only if a lab page uses WebAssembly threads / SharedArrayBuffer.
    # <LocationMatch "^/lab/g-meter/">
    #     Header set Cross-Origin-Opener-Policy "same-origin"
    #     Header set Cross-Origin-Embedder-Policy "require-corp"
    # </LocationMatch>

    ErrorLog  ${APACHE_LOG_DIR}/portfolio_error.log
    CustomLog ${APACHE_LOG_DIR}/portfolio_access.log combined
</VirtualHost>
