# Portfolio-specific Apache directives, included from the buisan.me vhost.
#
# This is NOT a vhost. The server's /etc/apache2/sites-available/buisan.me.conf
# owns the hostname, TLS, security headers and Nextcloud; its :443 vhost has
#     DocumentRoot /var/www/portfolio
#     Include /etc/apache2/portfolio.conf
#
# Install / update on the VPS:
#   scp deploy/portfolio.conf guilhem@buisan.me:/tmp/portfolio.conf
#   ssh guilhem@buisan.me
#   sudo install -m 644 -o root -g root /tmp/portfolio.conf /etc/apache2/portfolio.conf
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#
# Everything is scoped to /var/www/portfolio so none of it applies to /nextcloud.

<Directory /var/www/portfolio>
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted

    ErrorDocument 404 /404.html

    # WebAssembly (emulators, games). Debian's mime.types usually has this already.
    AddType application/wasm .wasm

    # HTML must be revalidated so deploys show up at once.
    <FilesMatch "\.html$">
        Header set Cache-Control "no-cache"
    </FilesMatch>
</Directory>

# Astro's bundled assets have a content hash in their name: cache them forever.
<Directory /var/www/portfolio/_astro>
    Header set Cache-Control "public, max-age=31536000, immutable"
</Directory>

# Needed only if a lab page uses WebAssembly threads / SharedArrayBuffer.
